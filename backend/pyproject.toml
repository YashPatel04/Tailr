[tool.poetry]
name = "resume-builder-backend"
version = "0.1.0"
description = "Tailr - Backend API"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.0" }
asyncpg = "^0.29.0"
alembic = "^1.13.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
httpx = "^0.27.0"
beautifulsoup4 = "^4.12.0"
duckduckgo-search = "^6.0.0"
python-docx = "^1.1.0"
pypdf = "^6.0.0"
slowapi = "^0.1.9"
bcrypt = "^4.1.0"
redis = "^5.0.0"
python-multipart = "^0.0.9"
email-validator = "^2.1.0"
aiosmtplib = "^3.0.0"
cryptography = "^43.0.0"
jinja2 = "^3.1.0"
deepdiff = "^8.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
ruff = "^0.6.0"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"app/services/llm/prompts.py" = ["E501"]
"app/services/importers/tex_llm_importer.py" = ["E501"]
"app/services/latex/compile_server.py" = ["N802"]
"app/services/research/scraper.py" = ["ASYNC109"]
"app/services/research/summarizer.py" = ["ASYNC109"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
