name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resume_builder
          POSTGRES_PASSWORD: resume_builder
          POSTGRES_DB: resume_builder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install poetry
      - run: cd backend && poetry install
      - run: cd backend && poetry run ruff check .
      - run: cd backend && poetry run ruff format --check .
      - run: >
          cd backend &&
          DATABASE_URL=postgresql+asyncpg://resume_builder:resume_builder@localhost:5432/resume_builder_test
          REDIS_URL=redis://localhost:6379/0
          SECRET_KEY=ci-secret-key-that-is-at-least-32-characters-long
          poetry run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd frontend && npm ci
      - run: cd frontend && npm install --include=optional --no-save
      - run: cd frontend && npm run lint
      - run: cd frontend && npx prettier --check .
      - run: cd frontend && NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 npm test
